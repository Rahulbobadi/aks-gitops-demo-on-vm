name: Deploy 1- VM Infrastructure Deployment

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Init
      working-directory: terraform/vm-infra
      run: terraform init -upgrade

    - name: Terraform Apply
      working-directory: terraform/vm-infra
      run: terraform apply -auto-approve
      env:
        TF_VAR_public_ssh_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
